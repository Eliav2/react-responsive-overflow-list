name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The demo's copies of the registry components are generated. If they were edited by hand, or the
      # registry source moved on without regenerating, fail here rather than shipping a silent mismatch.
      - name: Check generated registry copies
        run: pnpm sync:registry:check

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      # Builds the library the tests import, and runs attw + publint so packaging regressions fail too.
      - name: Build
        run: pnpm build

      - name: Type-check demo
        run: pnpm --filter demo exec tsc -b
